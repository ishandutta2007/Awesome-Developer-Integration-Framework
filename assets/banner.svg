<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#334155" fill-opacity="0.8" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .flow-node-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
        fill: #38bdf8;
      }
      .metric-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 20px;
        fill: #f8fafc;
      }
      .metric-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 12px;
        fill: #64748b;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-gradient)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <g opacity="0.45">
    <circle cx="150" cy="80" r="140" fill="#6366f1" filter="url(#glow-soft)">
      <animate attributeName="r" values="130;155;130" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="320" r="160" fill="#ec4899" filter="url(#glow-soft)">
      <animate attributeName="r" values="150;175;150" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.45;0.25" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="950" cy="90" r="120" fill="#06b6d4" filter="url(#glow-soft)">
      <animate attributeName="r" values="110;135;110" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="9s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Flow Pipelines / Integration Wireframes in Background Right -->
  <g opacity="0.35">
    <!-- Connecting curves -->
    <path d="M 680 70 C 820 70, 840 160, 980 160 S 1100 240, 1160 240" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" />
    <path d="M 720 330 C 840 330, 880 220, 1020 220 S 1120 130, 1180 130" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" />

    <!-- Animated packet stream 1 -->
    <circle r="5" fill="#38bdf8" filter="url(#glow)">
      <animateMotion path="M 680 70 C 820 70, 840 160, 980 160 S 1100 240, 1160 240" dur="5s" repeatCount="indefinite" />
    </circle>

    <!-- Animated packet stream 2 -->
    <circle r="5" fill="#ec4899" filter="url(#glow)">
      <animateMotion path="M 720 330 C 840 330, 880 220, 1020 220 S 1120 130, 1180 130" dur="6.5s" repeatCount="indefinite" />
    </circle>

    <!-- Integration Nodes -->
    <g transform="translate(950, 140)">
      <rect width="65" height="38" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="32" y="24" text-anchor="middle" class="flow-node-text">OAuth</text>
    </g>
    <g transform="translate(1080, 220)">
      <rect width="70" height="38" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="35" y="24" text-anchor="middle" class="flow-node-text" fill="#c084fc">Unified API</text>
    </g>
    <g transform="translate(850, 260)">
      <rect width="65" height="38" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" />
      <text x="32" y="24" text-anchor="middle" class="flow-node-text" fill="#f472b6">iPaaS</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header & Badges (Completely clear & unobstructed) -->
  <g transform="translate(70, 50)">
    <!-- Top Category Tag -->
    <g transform="translate(0, 0)">
      <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="20" class="pill-text" fill="#93c5fd" font-size="12">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title with Gradient Accent -->
    <text x="0" y="85" class="title-text">Awesome Developer</text>
    <text x="0" y="140" class="title-text" fill="url(#primary-grad)">Integration Frameworks</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="185" class="subtitle-text">
      The ultimate guide to Embedded iPaaS, Unified APIs, OAuth Lifecycle,
    </text>
    <text x="0" y="213" class="subtitle-text">
      Enterprise Automations &amp; Self-Hosted Open-Source Connectors.
    </text>

    <!-- Pill Feature Badges -->
    <g transform="translate(0, 245)">
      <!-- Pill 1: Embedded iPaaS -->
      <g transform="translate(0, 0)">
        <rect width="138" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" fill-opacity="0.8" />
        <text x="69" y="22" text-anchor="middle" class="pill-text">⚡ Embedded iPaaS</text>
      </g>
      <!-- Pill 2: Unified APIs -->
      <g transform="translate(148, 0)">
        <rect width="124" height="34" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" fill-opacity="0.8" />
        <text x="62" y="22" text-anchor="middle" class="pill-text">🔌 Unified APIs</text>
      </g>
      <!-- Pill 3: OAuth Management -->
      <g transform="translate(282, 0)">
        <rect width="160" height="34" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" fill-opacity="0.8" />
        <text x="80" y="22" text-anchor="middle" class="pill-text">🔐 OAuth Management</text>
      </g>
      <!-- Pill 4: Open Source -->
      <g transform="translate(452, 0)">
        <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" fill-opacity="0.8" />
        <text x="65" y="22" text-anchor="middle" class="pill-text">🌟 Open Source</text>
      </g>
      <!-- Pill 5: Transparent Pricing -->
      <g transform="translate(592, 0)">
        <rect width="168" height="34" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" fill-opacity="0.8" />
        <text x="84" y="22" text-anchor="middle" class="pill-text">💰 Transparent Pricing</text>
      </g>
    </g>

    <!-- Subtle Live Metrics Bar -->
    <g transform="translate(0, 305)">
      <rect width="660" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <g transform="translate(20, 27)">
        <text class="metric-title" fill="#38bdf8" font-size="16">14+ OS Frameworks</text>
      </g>
      <line x1="180" y1="8" x2="180" y2="34" stroke="#334155" stroke-width="1" />
      <g transform="translate(205, 27)">
        <text class="metric-title" fill="#a78bfa" font-size="16">9 Enterprise iPaaS</text>
      </g>
      <line x1="365" y1="8" x2="365" y2="34" stroke="#334155" stroke-width="1" />
      <g transform="translate(390, 27)">
        <text class="metric-title" fill="#34d399" font-size="16">100% Free Tiers Tracked</text>
      </g>
    </g>
  </g>

  <!-- Sleek Glowing Border Line at Bottom -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primary-grad)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" />
  </rect>
</svg>
